on:
  push:
    tags: ["v*"]

jobs:
  generate-version-matrix:
    name: Build Version Matrix
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      mod_version: ${{ steps.generate.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate Version Matrix
        id: generate
        # language="shell script"
        run: |
          declare -a versions
          for file in versionProperties/*.properties; do
            filename="$(basename "$file")"
            version="${filename%%.properties}"
            versions+=("$version")
          done
          matrix=$(printf '%s\n' "${versions[@]}" | jq -R . | jq -cs '{"version": .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "mod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-slim
    needs: [generate-version-matrix]
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build ${{ matrix.version }}
        env:
          MOD_VERSION: ${{ needs.generate-version-matrix.outputs.mod_version }}
        # language="shell script"
        run: |
          ./gradlew --console=plain --parallel --build-cache clean build \
            -Pminecraft_version=${{ matrix.version }} \
            -Pmod_version=${MOD_VERSION}
          ./gradlew -q --console=plain printEnabledPlatforms \
            -Pminecraft_version=${{ matrix.version }} > platforms.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.version }}
          path: |
            platforms.txt
            */build/libs/drinkandstretch-*-*-*.jar
            !*/build/libs/drinkandstretch-*-*-*-*.jar

  generate-publish-matrix:
    name: Generate Publish Matrix
    runs-on: ubuntu-slim
    needs: [generate-version-matrix, build]
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: false

      - name: Generate publish matrix
        id: generate
        env:
          MOD_VERSION: ${{ needs.generate-version-matrix.outputs.mod_version }}
        # language="shell script"
        run: |
          entries='[]'
          for dir in build-*/; do
            version="${dir#build-}"
            version="${version%/}"

            while IFS= read -r platform; do
              jar="${platform}/build/libs/drinkandstretch-${platform}-${version}-${MOD_VERSION}.jar"

              entry=$(jq -n \
                --arg v "$version" \
                --arg p "$platform" \
                --arg j "$jar" \
                --arg m "$MOD_VERSION" \
                '{minecraft_version: $v, platform: $p, artifact: $j}')
              entries=$(echo "$entries" | jq --argjson e "$entry" '. += [$e]')
            done < "${dir}platforms.txt"
          done

          matrix=$(echo "$entries" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-slim
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Drink and Stretch ${{ needs.generate-version-matrix.outputs.mod_version }}
          generate_release_notes: true

  publish:
    name: Publish
    runs-on: ubuntu-slim
    needs: [generate-version-matrix, generate-publish-matrix, github-release]
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.generate-publish-matrix.outputs.matrix) }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.minecraft_version }}

      - name: Publish ${{ matrix.minecraft_version }} / ${{ matrix.platform }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # modrinth-id: v6aXir3X
          # modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # curseforge-id: 1468688
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ matrix.artifact }}

          name: Drink and Stretch ${{ needs.generate-version-matrix.outputs.mod_version }} for Minecraft ${{ matrix.minecraft_version }}
          version: ${{ needs.generate-version-matrix.outputs.mod_version }}
          game-versions: ${{ matrix.minecraft_version }}
          loaders: ${{ matrix.platform }}
          version-type: release
