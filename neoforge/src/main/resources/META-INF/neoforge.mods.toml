modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "${issues}"
license = "${license}"

[[mods]]
modId = "${modId}"
version = "${version}"
displayName = "${displayName}"
authors = "${authors}"
displayURL = "${homepage}"
description = '''
${description}
'''
logoFile = "${iconLogo}"

[[dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforgeVersion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "cloth_config"
type = "required"
versionRange = "[${clothConfigVersion},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "drinkandstretch.mixins.json"
